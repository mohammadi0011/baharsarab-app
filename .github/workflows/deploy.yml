name: Deploy Mini App to Telegram Serverless

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync and Push
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          mkdir -p public
          cp -f index.html public/
          cp -rf css public/
          cp -rf js public/
          npx --yes @tgcloud/cli fetch
          npx --yes @tgcloud/cli push