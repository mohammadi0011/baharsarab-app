name: Deploy Mini App to Telegram Serverless

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Mini App only
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          # آماده‌سازی فایل‌های مینی‌اپ
          rm -rf public
          mkdir -p public
          cp -f index.html public/
          cp -rf css public/
          cp -rf js public/

          # هماهنگ کردن وضعیت (فایل‌های محلی را تغییر نمی‌دهد)
          npx --yes @tgcloud/cli fetch

          # فقط استاتیک‌ها را بفرست؛ handlers/endpoints/lib/db دست‌نخورده می‌مانند
          npx --yes @tgcloud/cli push public/